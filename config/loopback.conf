# Example upstream is Cloudflare. Replace with your provider's numeric DNS IPv4.
upstream_ipv4=1.1.1.1
upstream_port=53
listen_ipv4=127.0.0.1
# UDP 5353 is restricted on this development host; use 5354 for local testing.
listen_port=5354
timeout_ms=2000
workers=4
queue_capacity=64
blocklist=blocked.txt
allowlist=allowed.txt
feedlist=feed.txt
